name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rid }}

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp README.md USAGE.md AGENTS.md BENCHMARK.md LICENSE dist/
          for bin in csharp-format csformat-verify; do
            if [ -f "target/release/${bin}.exe" ]; then
              cp "target/release/${bin}.exe" dist/
            else
              cp "target/release/${bin}" dist/
            fi
          done
          tar -czf "csharp-format-${{ matrix.rid }}.tar.gz" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: csharp-format-*.tar.gz
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC token for NuGet trusted publishing (short-lived API key).
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            version="${base}-nightly.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Packaging version ${version}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Pack .NET tool packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p bins nupkg

          for tarball in artifacts/csharp-format-*.tar.gz; do
            rid=$(basename "$tarball")
            rid=${rid#csharp-format-}
            rid=${rid%.tar.gz}
            mkdir -p "bins/$rid"
            tar -xzf "$tarball" -C "bins/$rid"
          done

          # A partial build must not produce a pointer package that advertises
          # RID packages which do not exist.
          for rid in linux-x64 win-x64 osx-arm64; do
            if [ ! -d "bins/$rid" ]; then
              echo "::error::missing build artifact for $rid"
              exit 1
            fi
          done

          args=()
          for dir in bins/*/; do
            rid=$(basename "$dir")
            binary=$(find "$dir" -maxdepth 1 -type f \
              \( -name 'csharp-format' -o -name 'csharp-format.exe' \) | head -n1)
            if [ -z "$binary" ]; then
              echo "::error::no csharp-format binary in $dir"
              exit 1
            fi
            args+=(--binary "$rid=$binary")
          done

          python3 scripts/pack_dotnet_tool.py \
            --version "$VERSION" \
            --out nupkg \
            --project-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "${args[@]}"

          ls -l nupkg

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          # nuget.org rejects a license expression without the matching
          # licenseUrl (https://aka.ms/invalidNuGetLicenseUrl); catch it here
          # instead of after the upload.
          python3 scripts/check_nupkg.py nupkg/*.nupkg

      - name: NuGet login (OIDC → temporary API key)
        # Only tagged releases publish; a missing NUGET_USER variable keeps the
        # workflow limited to GitHub release assets.
        if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # nuget.org profile name, NOT the email address.
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # RID packages first: the pointer package references them by version.
          for pkg in nupkg/*.nupkg; do
            name=$(basename "$pkg")
            if [ "$name" = "csharp-format.$VERSION.nupkg" ]; then
              continue
            fi
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          dotnet nuget push "nupkg/csharp-format.$VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          if [ "$REF_IS_TAG" = "true" ]; then
            tag="${GITHUB_REF_NAME}"
            title="${GITHUB_REF_NAME}"
          else
            # A version tag creates a normal release; pushes to main update a
            # single rolling "nightly" prerelease so history stays readable.
            tag="nightly"
            title="Nightly"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; replacing its assets"
          else
            args=(--title "$title" --generate-notes)
            if [ "$REF_IS_TAG" = "true" ]; then
              args+=(--verify-tag)
            else
              args+=(--prerelease --target "$GITHUB_SHA")
            fi
            gh release create "$tag" "${args[@]}"
          fi

          release_id=$(gh release view "$tag" --json databaseId --jq .databaseId)
          api="repos/${GITHUB_REPOSITORY}/releases"

          is_ours() {
            case "$1" in
              csharp-format*.nupkg | csharp-format-*.tar.gz) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Delete the assets this workflow owns. The nightly release is reused
          # on every run, and a re-run of a tag workflow replaces its own too.
          while IFS=$'\t' read -r id name; do
            if is_ours "$name"; then
              echo "deleting asset ${name}"
              gh api -X DELETE "${api}/assets/${id}" >/dev/null
            fi
          done < <(gh api "${api}/${release_id}/assets" --paginate \
            --jq '.[] | [.id, .name] | @tsv')

          # Deleting an asset is not immediately visible to the upload
          # endpoint: re-uploading the same name right away can fail with
          # 422 "ReleaseAsset.name already exists". Wait until the assets stop
          # being listed.
          for attempt in $(seq 1 30); do
            remaining=0
            while IFS=$'\t' read -r _id name; do
              if is_ours "$name"; then remaining=$((remaining + 1)); fi
            done < <(gh api "${api}/${release_id}/assets" --paginate \
              --jq '.[] | [.id, .name] | @tsv')
            if [ "$remaining" -eq 0 ]; then
              break
            fi
            echo "waiting for ${remaining} deleted asset(s) to disappear"
            sleep 2
          done

          # Upload one file at a time, retrying while the deletion settles.
          for file in artifacts/csharp-format-*.tar.gz nupkg/*.nupkg; do
            name=$(basename "$file")
            for attempt in $(seq 1 8); do
              if gh release upload "$tag" "$file" >/dev/null \
                2>"${RUNNER_TEMP}/upload.err"; then
                echo "uploaded ${name}"
                break
              fi
              if ! grep -q "already exists" "${RUNNER_TEMP}/upload.err"; then
                cat "${RUNNER_TEMP}/upload.err"
                exit 1
              fi
              if [ "$attempt" -eq 8 ]; then
                cat "${RUNNER_TEMP}/upload.err"
                exit 1
              fi
              echo "${name} is still propagating; retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
          done
