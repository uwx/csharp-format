[workspace]
resolver = "3"
members = ["crates/csformat-core", "crates/csformat-cli", "crates/csformat-verify"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["csharp-format contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.7"
thiserror = "2.0"
tree-sitter = "0.27"
tree-sitter-c-sharp = { git = "https://github.com/tree-sitter/tree-sitter-c-sharp", rev = "f2dea45d6f6998839f2617c5137624654a58fa80" }
unicode-ident = "1.0"
quick-xml = "0.38"
regex = "1.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
